<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Results</title>
<style>
:root{--bg:#f2f7f6;--card:#fff;--text:#12211f;--muted:#5c6e6b;--teal:#3f8f93;--line:#d5e2e0;--ok:#1f8a4c;--high:#c0392b;--low:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08110b;--card:#12201f;--text:#eef5f4;--muted:#9bb2af;--teal:#5b9ea0;--line:#27403e;--ok:#4cc380;--high:#ff7a6b;--low:#f0b24a}}
:root[data-theme="dark"]{--bg:#08110b;--card:#12201f;--text:#eef5f4;--muted:#9bb2af;--teal:#5b9ea0;--line:#27403e;--ok:#4cc380;--high:#ff7a6b;--low:#f0b24a}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",system-ui,sans-serif;padding:20px 16px 40px;max-width:560px;margin-inline:auto}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.summary{display:flex;gap:10px;margin-bottom:18px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.pill b{display:block;font-size:22px}
.pill span{font-size:12px;color:var(--muted)}
.t{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.t button{all:unset;display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;padding:16px;cursor:pointer}
.t button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.name{font-size:16px;font-weight:700}
.date{font-size:12px;color:var(--muted);margin-top:2px}
.val{text-align:right;font-weight:700;font-size:16px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;margin-top:4px;border:1px solid currentColor}
.ok{color:var(--ok)}.high{color:var(--high)}.low{color:var(--low)}
.more{display:none;padding:0 16px 16px}
.t.open .more{display:block}
.bar{position:relative;height:8px;border-radius:99px;background:var(--line);margin:14px 0 6px}
.bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--teal);opacity:.5}
.bar u{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:currentColor}
.rng{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<h1>Lab results</h1>
<p class="sub">Collected 28 Sep 2026 · Dr. Sample Name</p>

<div class="summary">
  <div class="pill"><b>6</b><span>Tests</span></div>
  <div class="pill"><b class="ok">4</b><span>Normal</span></div>
  <div class="pill"><b class="high">2</b><span>Need review</span></div>
</div>

<div id="list"></div>

<p class="foot">Sample data for app demo only.<br>Always discuss results with your doctor.</p>

<script>
var tests=[
 {n:"Hemoglobin",v:13.8,u:"g/dL",lo:12,hi:16,min:8,max:20,note:"Within the healthy range."},
 {n:"White blood cells",v:11.9,u:"×10³/µL",lo:4,hi:11,min:2,max:16,note:"Slightly above range. Your doctor may ask for a repeat test."},
 {n:"Glucose (fasting)",v:92,u:"mg/dL",lo:70,hi:100,min:50,max:140,note:"Within the healthy range."},
 {n:"Cholesterol (total)",v:221,u:"mg/dL",lo:0,hi:200,min:100,max:300,note:"Above the recommended level. Ask your doctor about diet and follow-up."},
 {n:"Vitamin D",v:34,u:"ng/mL",lo:30,hi:100,min:0,max:120,note:"Within the healthy range."},
 {n:"Creatinine",v:0.9,u:"mg/dL",lo:0.6,hi:1.2,min:0,max:2,note:"Within the healthy range."}
];
var el=document.getElementById("list");
tests.forEach(function(t){
 var s=t.v<t.lo?"low":t.v>t.hi?"high":"ok";
 var label={ok:"Normal",high:"High",low:"Low"}[s];
 var p=function(x){return Math.max(0,Math.min(100,(x-t.min)/(t.max-t.min)*100))};
 var d=document.createElement("div");d.className="t";
 d.innerHTML='<button aria-expanded="false"><div><div class="name">'+t.n+'</div><div class="date">28 Sep 2026</div></div>'+
 '<div class="val '+s+'">'+t.v+' <small>'+t.u+'</small><br><span class="tag">'+label+'</span></div></button>'+
 '<div class="more"><div class="bar '+s+'"><i style="left:'+p(t.lo)+'%;width:'+(p(t.hi)-p(t.lo))+'%"></i><u style="left:calc('+p(t.v)+'% - 2px)"></u></div>'+
 '<div class="rng"><span>Normal: '+t.lo+' – '+t.hi+' '+t.u+'</span></div><p class="note">'+t.note+'</p></div>';
 d.querySelector("button").onclick=function(){var o=d.classList.toggle("open");this.setAttribute("aria-expanded",o)};
 el.appendChild(d);
});
</script>
</body>
</html>
